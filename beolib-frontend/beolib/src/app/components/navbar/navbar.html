<nav class="navbar">
  <a routerLink="/books" class="brand">BeoLib</a>

  <div class="links">
    @if (authService.session().loggedIn) {
      <a routerLink="/books" routerLinkActive="active">Knjige</a>
      <a routerLink="/reservations" routerLinkActive="active">Rezervacije</a>
      <a routerLink="/reading-history" routerLinkActive="active">Istorija čitanja</a>

      @if (authService.session().isAdmin) {
        <a routerLink="/admin/books" routerLinkActive="active">Admin knjige</a>
        <a routerLink="/admin/branches" routerLinkActive="active">Admin filijale</a>
      }

      <button type="button" class="link-button" (click)="logout()">Odjava</button>
    } @else {
      <a routerLink="/books" routerLinkActive="active">Knjige</a>
      <a routerLink="/login" routerLinkActive="active">Prijava</a>
      <a routerLink="/register" routerLinkActive="active">Registracija</a>
    }
  </div>
</nav>
